name: Nightly Release
description: Download build artifacts, create archives, and update the nightly release.

inputs:
  github-token:
    description: GitHub token used by the nightly release action.
    required: true

runs:
  using: composite
  steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Create archives
      shell: bash
      run: |
        set +e
        cd artifacts
        zip -r ../paopao.nightly.linux.zip linuxBuild/
        zip -r ../paopao.nightly.windows.zip windowsBuild/
        zip -r ../paopao.nightly.mac.zip macBuild/
        find androidBuild/ -name "*.apk" -exec zip ../paopao.nightly.android.zip {} \;
        exit 0

    - name: Update Nightly Release
      uses: andelf/nightly-release@main
      if: always()
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      with:
        tag_name: nightly
        name: "Development Release"
        body: |
          This is a nightly build of **PaoPao Engine** for commit ${{ github.sha }} from ${{ github.ref_name }}.

          This is a development release of **PaoPao Engine**. It is not recommended for production use.

          Please use this version only for testing and development purposes.
        files: |
          paopao.nightly.linux.zip
          paopao.nightly.windows.zip
          paopao.nightly.mac.zip
          paopao.nightly.android.zip
