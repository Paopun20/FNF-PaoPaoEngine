name: Setup Build Environment
description: Prepare the runner, Haxe, Haxelib, and target-specific build dependencies.

inputs:
  target:
    description: Build target from the workflow matrix.
    required: true
  lib-path:
    description: Haxelib repository path.
    required: true
  setup-file:
    description: Platform-specific Haxelib setup script.
    required: true

runs:
  using: composite
  steps:
    - uses: xom9ikk/dotenv@v2.3.0
      with:
        path: .env
        load-mode: skip

    - uses: HaxeFoundation/setup-haxe@v2.0.3
      with:
        haxe-version: 4.3.7

    - name: Setup Android SDK
      if: inputs.target == 'android'
      uses: android-actions/setup-android@v4

    - name: Install Android packages
      if: inputs.target == 'android'
      shell: powershell
      run: |
        sdkmanager "platform-tools" `
                   "platforms;android-33" `
                   "build-tools;33.0.2" `
                   "ndk;21.4.7075529" `
                   "cmake;3.22.1"

    - name: Set up Java 11
      if: inputs.target == 'android'
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 11

    - name: Install Linux dependencies
      if: inputs.target == 'linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install libvlc-dev libvlccore-dev
        sudo apt install \
          g++ \
          g++-multilib \
          gcc-multilib \
          libasound2-dev \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libpulse-dev \
          libx11-dev \
          libxext-dev \
          libxi-dev \
          libxinerama-dev \
          libxrandr-dev
        sudo pacman -S --needed \
          switch-bzip2 \
          switch-cmake \
          switch-curl \
          switch-flac \
          switch-freetype \
          switch-glad \
          switch-glm \
          switch-harfbuzz \
          switch-libdrm_nouveau \
          switch-libjpeg-turbo \
          switch-libmodplug \
          switch-libogg \
          switch-libopus \
          switch-libpng \
          switch-libvorbis \
          switch-libvorbisidec \
          switch-libwebp \
          switch-mesa \
          switch-mpg123 \
          switch-openal-soft \
          switch-opusfile \
          switch-pkg-config \
          switch-sdl2 \
          switch-sdl2_gfx \
          switch-sdl2_image \
          switch-sdl2_mixer \
          switch-sdl2_net \
          switch-sdl2_ttf \
          switch-tools \
          switch-zlib

    - name: Cache Dependencies
      uses: actions/cache@v5
      with:
        fail-on-cache-miss: true
        enableCrossOsArchive: true
        path: ${{ inputs.lib-path }}
        key: ${{ runner.os }}-haxelib-${{ hashFiles(inputs.setup-file) }}
        restore-keys: |
          ${{ runner.os }}-haxelib-

    - name: Setup Haxelib (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        haxelib setup "${{ inputs.lib-path }}"
        haxelib --global update haxelib
        haxelib fixrepo

    - name: Setup Haxelib (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        haxelib setup "${{ inputs.lib-path }}"
        haxelib --global update haxelib
        haxelib fixrepo

    - name: Install Haxelib (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        chmod +x "${{ inputs.setup-file }}"
        sh "${{ inputs.setup-file }}"

    - name: Install Haxelib (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        . "${{ inputs.setup-file }}"

    - name: Select Xcode
      if: contains(fromJSON('["ios","tvos"]'), inputs.target)
      shell: bash
      run: sudo xcode-select -s /Applications/Xcode_16.2.app

    - name: Create Version Tag
      shell: bash
      run: echo "${{ github.run_id }}" > VERSION

    - name: Configure Windows for Android build
      if: inputs.target == 'android'
      shell: powershell
      run: |
        # Disable Windows Defender real-time protection because it can intercept NDK
        # compiler executables and corrupt object files during the link step.
        Set-MpPreference -DisableRealtimeMonitoring $true

        # Enable long paths for deeply nested NDK intermediate files.
        Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name LongPathsEnabled -Value 1 -Force
        git config --system core.longpaths true

    - name: Configure Lime Android Environment
      if: inputs.target == 'android'
      shell: powershell
      run: |
        $androidNdk = Join-Path $env:ANDROID_HOME "ndk\21.4.7075529"
        $env:ANDROID_SDK = $env:ANDROID_HOME
        $env:ANDROID_NDK_ROOT = $androidNdk
        $env:ANDROID_NDK_HOME = $androidNdk
        $env:JAVA_HOME = $env:JAVA_HOME_11_X64

        Write-Output "ANDROID_SDK=$env:ANDROID_SDK" >> $env:GITHUB_ENV
        Write-Output "ANDROID_NDK_ROOT=$env:ANDROID_NDK_ROOT" >> $env:GITHUB_ENV
        Write-Output "ANDROID_NDK_HOME=$env:ANDROID_NDK_HOME" >> $env:GITHUB_ENV
        Write-Output "JAVA_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV

        # Keep hxcpp failures visible instead of caching corrupt object files.
        Write-Output "HXCPP_COMPILE_THREADS=1" >> $env:GITHUB_ENV
        Write-Output "HXCPP_VERBOSE=1" >> $env:GITHUB_ENV
        haxelib run lime setup android
