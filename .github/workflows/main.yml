# This is a basic workflow to help you get started with Actions

name: Build

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

  workflow_dispatch:
    inputs:
      nightly:
        default: false
        type: boolean
        description: "Create nightly release"

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact-name: linuxBuild
            export-path: export/release/linux/bin
            lib-path: ~/haxelib
            setup-file: ./setup/unix.sh

          - os: windows-latest
            target: windows
            artifact-name: windowsBuild
            export-path: export/release/windows/bin
            lib-path: C:/haxelib
            setup-file: ./setup/windows.ps1

          - os: macos-latest
            target: mac
            artifact-name: macBuild
            export-path: export/release/macos/bin
            lib-path: ~/haxelib
            setup-file: ./setup/unix.sh

          # - os: macos-latest
          #   target: ios
          #   artifact-name: iosBuild
          #   export-path: export/release/ios/
          #   lib-path: ~/haxelib
          #   setup-file: ./setup/unix.sh

          - os: windows-latest
            target: android
            artifact-name: androidBuild
            export-path: export/release/android/bin/app/
            lib-path: C:/haxelib
            setup-file: ./setup/windows.ps1

          # - os: macos-15
          #   target: tvos
          #   artifact-name: tvosBuild
          #   export-path: export/release/tvos
          #   lib-path: ~/haxelib
          #   setup-file: ./setup/unix.sh

    runs-on: ${{ matrix.os }}
    env:
      DISCORD_RPC_ID: ${{ secrets.DISCORD_RPC_ID }}

    steps:
      - uses: actions/checkout@v4.1.7

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Setup Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        if: matrix.target == 'android'
        run: |
          sdkmanager "platform-tools" "platforms;android-19" "build-tools;19.1.0" "ndk;21.4.7075529"

      - name: Set up Java 11
        if: matrix.target == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 11

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install libvlc-dev libvlccore-dev
          sudo apt install libgl1-mesa-dev libglu1-mesa-dev g++ g++-multilib gcc-multilib libasound2-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev libpulse-dev

      - name: Cache Dependencies
        uses: actions/cache@v5
        with:
          path: ${{ matrix.lib-path }}
          key: ${{ runner.os }}-haxelib-${{ hashFiles(matrix.setup-file) }}
          restore-keys: |
            ${{ runner.os }}-haxelib-

      - name: Install Haxelib (Unix)
        if: runner.os != 'Windows'
        run: |
          haxelib setup ${{ matrix.lib-path }}
          haxelib --global update haxelib
          haxelib fixrepo
          chmod +x ${{ matrix.setup-file }}
          sh ${{ matrix.setup-file }}

      - name: Install Haxelib (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          haxelib setup ${{ matrix.lib-path }}
          haxelib --global update haxelib
          haxelib fixrepo
          . ${{ matrix.setup-file }}

      - name: Skip SScript setup mode (Unix)
        if: runner.os != 'Windows'
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      - name: Skip SScript setup mode (Windows)
        if: runner.os == 'Windows'
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> %USERPROFILE%/settings.cocoa
        shell: cmd

      - name: Select Xcode
        if: matrix.target == 'ios' || matrix.target == 'tvos'
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION

      - name: Compile (Apple IOS)
        if: matrix.target == 'ios'
        run: |
          haxelib remove lime || true
          git clone --recursive https://github.com/openfl/lime
          haxelib dev lime lime
          haxelib run lime rebuild ${{ matrix.target }}
          haxelib run lime build ios --app-version="4.0.0-${{ github.run_id }}" -D officialBuild -nosign

      - name: Configure Lime Android Environment
        if: matrix.target == 'android'
        shell: powershell
        run: |
          "$env:ANDROID_SDK_ROOT`n$env:ANDROID_SDK_ROOT/ndk/21.4.7075529`n$env:JAVA_HOME" |
            haxelib run lime setup android

      - name: Compile (Android)
        if: matrix.target == 'android'
        run: |
          haxelib run lime build android --app-version="4.0.0-${{ github.run_id }}" -D officialBuild -release

      - name: Compile (Apple TV)
        if: matrix.target == 'tvos'
        run: |
          haxelib install format 3.8.0
          haxelib install hxp 1.3.1
          haxelib remove lime
          git clone --recursive https://github.com/openfl/lime
          haxelib dev lime lime
          haxelib remove hxcpp
          git clone --recursive https://github.com/HaxeFoundation/hxcpp.git
          haxelib dev hxcpp hxcpp
          haxelib run lime rebuild tvos
          haxelib run lime build ${{ matrix.target }} --app-version="4.0.0-${{ github.run_id}}" -D officialBuild -nosign

      - name: Compile (Anyelse)
        if: matrix.target != 'ios' && matrix.target != 'tvos' && matrix.target != 'android'
        run: |
          haxelib run lime build ${{ matrix.target }} --app-version="4.0.0-${{ github.run_id}}" -D officialBuild

      - name: Publish Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.export-path }}

  create-nightly-release:
    name: Nightly Release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ (inputs.nightly || github.event_name == 'push') && !cancelled() }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create archives
        continue-on-error: true
        run: |
          cd artifacts
          zip -r ../paopao.nightly.linux.zip linuxBuild/
          zip -r ../paopao.nightly.windows.zip windowsBuild/
          zip -r ../paopao.nightly.mac.zip macBuild/
          find androidBuild/ -name "*.apk" -exec zip ../paopao.nightly.android.zip {} \;

      - name: Update Nightly Release
        uses: andelf/nightly-release@main
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: "Development Release"
          body: |
            This is a nightly build of **PaoPao Engine** for commit ${{ github.sha }}.

            This is a development release of **PaoPao Engine**. It is not recommended for production use.

            Please use this version only for testing and development purposes.
          files: |
            paopao.nightly.linux.zip
            paopao.nightly.windows.zip
            paopao.nightly.mac.zip
            paopao.nightly.android.zip
