name: Build

on:
  push:
    branches: [main, dev]

  release:
    types: [published, created]

  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]

  workflow_dispatch:
    inputs:
      nightly:
        default: false
        type: boolean
        description: "Create nightly release"

jobs:
  build:
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact-name: linuxBuild
            export-path: export/release/linux/bin
            lib-path: ~/haxelib
            setup-file: ./setup/unix.sh

          - os: windows-latest
            target: windows
            artifact-name: windowsBuild
            export-path: export/release/windows/bin
            lib-path: C:/haxelib
            setup-file: ./setup/windows.ps1

          - os: macos-latest
            target: mac
            artifact-name: macBuild
            export-path: export/release/macos/bin
            lib-path: ~/haxelib
            setup-file: ./setup/unix.sh

    runs-on: ${{ matrix.os }}

    env:
      DISCORD_RPC_ID: ${{ secrets.DISCORD_RPC_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load env file
        uses: xom9ikk/dotenv@v2.3.0
        with:
          path: .env
          load-mode: skip

      - name: Setup Haxe
        uses: HaxeFoundation/setup-haxe@v2.0.3
        with:
          haxe-version: 4.3.7

      - name: Install Linux deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvlc-dev libvlccore-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            g++ g++-multilib gcc-multilib \
            libasound2-dev libx11-dev libxext-dev \
            libxi-dev libxrandr-dev libxinerama-dev libpulse-dev \
            zip wget

      - name: Setup Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v4

      - name: Setup Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 11

      - name: Install Android packages
        if: matrix.target == 'android'
        shell: bash
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-33" \
                     "build-tools;33.0.2" \
                     "ndk;21.4.7075529" \
                     "cmake;3.22.1"

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ${{ matrix.lib-path }}
          key: ${{ runner.os }}-haxelib
          restore-keys: |
            ${{ runner.os }}-haxelib-

      - name: Setup Haxelib
        run: |
          haxelib setup ${{ matrix.lib-path }}
          haxelib --global update haxelib

      - name: Install Haxelib deps (Unix)
        if: matrix.target != 'windows'
        run: |
          chmod +x ${{ matrix.setup-file }} || true

      - name: Install Haxelib deps (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File ${{ matrix.setup-file }}
          sh ${{ matrix.setup-file }}

      - name: Fix Hxcpp (mac)
        if: matrix.target != 'mac'
        run: haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp --always

      - name: Build project
        run: |
          haxelib run lime build ${{ matrix.target }} --app-version="4.0.0-${{ github.run_id }}" -D officialBuild -final

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.export-path }}

  create-nightly-release:
    name: Nightly Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    if: ${{ (inputs.nightly || github.event_name == 'push') && !cancelled() }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package builds
        run: |
          cd artifacts

          zip -9 -r ../linux.zip linuxBuild || true
          zip -9 -r ../windows.zip windowsBuild || true
          zip -9 -r ../mac.zip macBuild || true

      - name: Publish nightly
        uses: andelf/nightly-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: "Development Build"
          body: |
            This is a nightly build of **PaoPao Engine** for commit ${{ github.sha }} from ${{ github.ref_name }} branch.

            This is a development release of **PaoPao Engine**.
            It is not recommended for production use.
            Please use this version only for testing and development purposes.
          files: |
            linux.zip
            windows.zip
            mac.zip
