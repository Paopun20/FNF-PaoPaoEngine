# to matrix aaction

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact-name: linuxBuild
            export-path: export/release/linux/bin
          - os: windows-latest
            target: windows
            artifact-name: windowsBuild
            export-path: export/release/windows/bin
          - os: macos-15
            target: mac
            artifact-name: macBuild
            export-path: export/release/macos/bin

    runs-on: ${{ matrix.os }}
    env:
      DISCORD_RPC_ID: ${{ secrets.DISCORD_RPC_ID }}

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4.1.7

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      # Linux-specific dependencies
      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install libvlc-dev libvlccore-dev
      
      - name: Cache Dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/haxelib
          key: ${{ runner.os }}-haxelib-${{ hashFiles('**/setup/commands.txt') }}
          restore-keys: |
            ${{ runner.os }}-haxelib-

      # Install Haxelib (Unix-like systems)
      - name: Install Haxelib (Unix)
        if: matrix.target != 'windows'
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null --quiet
          chmod +x ./setup/unix.sh
          sh ./setup/unix.sh

      # Install Haxelib (Windows)
      - name: Install Haxelib (Windows)
        if: matrix.target == 'windows'
        run: |
          haxelib setup C:/haxelib
          haxelib install hxcpp > /dev/null --quiet
          powershell ./setup/windows.ps1
        shell: cmd

      # Skip SScript setup mode (Unix)
      - name: Skip SScript setup mode (Unix)
        if: matrix.target != 'windows'
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> ~/settings.cocoa

      # Skip SScript setup mode (Windows)
      - name: Skip SScript setup mode (Windows)
        if: matrix.target == 'windows'
        run: echo 'oy9:showMacroty8:loopCosti25y10:includeAllfg' >> %USERPROFILE%/settings.cocoa
        shell: cmd

      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION

      - name: Compile
        run: haxelib run lime build ${{ matrix.target }} --app-version="4.0.0-${{ github.run_id}}" -D officialBuild

      - name: Publish Artifact
        uses: actions/upload-artifact@v4.3.4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.export-path }}

  create-nightly-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create archives
        run: |
          cd artifacts
          zip -r ../linuxBuild.zip linuxBuild/
          zip -r ../windowsBuild.zip windowsBuild/
          zip -r ../macBuild.zip macBuild/

      - name: Check if nightly release exists
        id: check_release
        run: |
          if gh release view nightly --repo ${{ github.repository }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Nightly release exists, will update it"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Nightly release does not exist, will create it"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete existing nightly release assets
        if: steps.check_release.outputs.exists == 'true'
        run: |
          gh release delete nightly --repo ${{ github.repository }} --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          repository: ${{ github.repository }}
          make_latest: true
          prerelease: true
          draft: false
          token: ${{ secrets.GITREUP }}
          name: Nightly Build
          body: |
            **PaoPao Engine** development release for commit `${{ github.sha }}`. Since this is not a regular release, **PaoPao Engine** will not install the resources automatically, so you should use the engine if you want them.
          files: |
            linuxBuild.zip
            windowsBuild.zip
            macBuild.zip